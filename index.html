<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0a84ff">

  <title>Flackunloker</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 24px 18px 110px;
    }

    .encabezado {
      text-align: center;
      margin: 20px 0 30px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #0a84ff, #0055cc);
      box-shadow: 0 10px 25px rgba(10, 132, 255, .25);
    }

    .titulo {
      margin: 15px 0 5px;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitulo {
      margin: 0;
      color: #777;
      font-size: 15px;
    }

    /* =========================
       RESUMEN INVENTARIO
    ========================= */

    .resumen {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .tarjeta {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    .tarjeta span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .tarjeta strong {
      font-size: 24px;
    }

    .tarjeta.valor {
      grid-column: 1 / -1;
    }

    .tarjeta.valor strong {
      color: #0a84ff;
    }

    /* =========================
       BUSQUEDA
    ========================= */

    .busqueda,
    .busqueda-historial {
      width: 100%;
      border: 0;
      outline: none;
      background: #fff;
      border-radius: 15px;
      padding: 15px 17px;
      font-size: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    .busqueda {
      margin-bottom: 20px;
    }

    .busqueda-historial {
      margin-bottom: 12px;
    }

    /* =========================
       TITULOS
    ========================= */

    .seccion-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px;
    }

    .seccion-titulo h2 {
      margin: 0;
      font-size: 20px;
    }

    /* =========================
       BOTON AGREGAR
    ========================= */

    .boton-agregar {
      border: 0;
      background: #0a84ff;
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* =========================
       PRODUCTOS
    ========================= */

    .producto {
      background: #fff;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    .producto-superior {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .producto-info {
      min-width: 0;
    }

    .producto-info h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .producto-info p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    .cantidad {
      background: #eaf4ff;
      color: #0a84ff;
      padding: 8px 11px;
      border-radius: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .producto-precio {
      margin-top: 12px;
      color: #555;
      font-size: 14px;
    }

    .producto-precio strong {
      color: #111;
    }

    /* =========================
       ACCIONES
    ========================= */

    .acciones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 14px;
    }

    .accion {
      border: 0;
      border-radius: 10px;
      padding: 9px 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .entrada {
      background: #e9f8ef;
      color: #168044;
    }

    .salida {
      background: #fff1e8;
      color: #c45b19;
    }

    .editar {
      background: #eaf4ff;
      color: #0a84ff;
    }

    .eliminar {
      background: #ffecec;
      color: #d93025;
    }

    /* =========================
       SIN PRODUCTOS
    ========================= */

    .sin-productos {
      text-align: center;
      color: #777;
      padding: 30px 15px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    /* =========================
       RESUMEN HISTORIAL
    ========================= */

    .resumen-historial {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .tarjeta-historial {
      background: #fff;
      border-radius: 15px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    .tarjeta-historial span {
      display: block;
      font-size: 11px;
      color: #777;
      margin-bottom: 7px;
    }

    .tarjeta-historial strong {
      font-size: 20px;
    }

    .tarjeta-historial.entradas strong {
      color: #168044;
    }

    .tarjeta-historial.salidas strong {
      color: #c45b19;
    }

    /* =========================
       FILTROS HISTORIAL
    ========================= */

    .filtros-historial {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .filtro-historial {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 11px 8px;
      background: #eee;
      color: #555;
      font-weight: 600;
      cursor: pointer;
    }

    .filtro-historial.activo {
      background: #0a84ff;
      color: #fff;
    }

    /* =========================
       MOVIMIENTOS
    ========================= */

    .movimiento {
      background: #fff;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
    }

    .movimiento-superior {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .movimiento-info {
      min-width: 0;
    }

    .movimiento-info h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .movimiento-info p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    .movimiento-tipo {
      padding: 8px 11px;
      border-radius: 10px;
      font-weight: 700;
      white-space: nowrap;
      font-size: 13px;
    }

    .movimiento-tipo.entrada {
      background: #e9f8ef;
      color: #168044;
    }

    .movimiento-tipo.salida {
      background: #fff1e8;
      color: #c45b19;
    }

    .movimiento-detalle {
      margin-top: 12px;
      color: #555;
      font-size: 13px;
      line-height: 1.7;
    }

    .saldo-movimiento {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #333;
    }

    .saldo-movimiento strong {
      color: #0a84ff;
    }

    /* =========================
       BORRAR HISTORIAL
    ========================= */

    .boton-borrar-historial {
      width: 100%;
      border: 0;
      background: #ffecec;
      color: #d93025;
      border-radius: 12px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }

    /* =========================
       MODALES
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 1000;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.visible {
      display: flex;
    }

    .formulario {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .2);
    }

    .formulario h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .campo input {
      width: 100%;
      border: 1px solid #ddd;
      outline: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
    }

    .campo input:focus {
      border-color: #0a84ff;
    }

    .botones-formulario {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .boton-cancelar,
    .boton-guardar {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .boton-cancelar {
      background: #eee;
      color: #333;
    }

    .boton-guardar {
      background: #0a84ff;
      color: #fff;
    }

    .mensaje-movimiento {
      margin: 0 0 18px;
      padding: 12px;
      border-radius: 12px;
      background: #eaf4ff;
      color: #0a84ff;
      font-size: 14px;
    }

    /* =========================
       MENU
    ========================= */

    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #eee;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 35px;
      z-index: 500;
    }

    .menu button {
      border: 0;
      background: none;
      font-size: 13px;
      color: #777;
      cursor: pointer;
    }

    .menu .activo {
      color: #0a84ff;
      font-weight: 700;
    }

    /* =========================
       MOVIL
    ========================= */

    @media (max-width: 400px) {

      .acciones {
        grid-template-columns: repeat(2, 1fr);
      }

      .producto-superior,
      .movimiento-superior {
        gap: 8px;
      }

      .filtros-historial {
        gap: 6px;
      }

      .filtro-historial {
        font-size: 12px;
        padding: 10px 5px;
      }

      .tarjeta-historial {
        padding: 12px 6px;
      }

      .tarjeta-historial strong {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <!-- =========================
         ENCABEZADO
    ========================= -->

    <div class="encabezado">

      <div class="logo"></div>

      <h1 class="titulo">
        Flackunloker
      </h1>

      <p class="subtitulo">
        Control de inventario
      </p>

    </div>


    <!-- =========================
         VISTA INVENTARIO
    ========================= -->

    <div id="vistaInventario">

      <div class="resumen">

        <div class="tarjeta">

          <span>
            Productos
          </span>

          <strong id="totalProductos">
            0
          </strong>

        </div>


        <div class="tarjeta">

          <span>
            Unidades
          </span>

          <strong id="totalUnidades">
            0
          </strong>

        </div>


        <div class="tarjeta valor">

          <span>
            Valor del inventario
          </span>

          <strong id="valorInventario">
            $0.00
          </strong>

        </div>

      </div>


      <input
        id="busqueda"
        class="busqueda"
        type="search"
        placeholder="Buscar producto..."
      >


      <div class="seccion-titulo">

        <h2>
          Inventario
        </h2>

        <button
          class="boton-agregar"
          onclick="abrirFormulario()"
        >
          + Agregar
        </button>

      </div>


      <div id="listaProductos"></div>

    </div>


    <!-- =========================
         VISTA HISTORIAL
    ========================= -->

    <div
      id="vistaHistorial"
      style="display:none;"
    >

      <div class="seccion-titulo">

        <h2>
          Historial
        </h2>

      </div>


      <!-- RESUMEN DEL HISTORIAL -->

      <div class="resumen-historial">

        <div class="tarjeta-historial">

          <span>
            Movimientos
          </span>

          <strong id="totalMovimientos">
            0
          </strong>

        </div>


        <div class="tarjeta-historial entradas">

          <span>
            Entradas
          </span>

          <strong id="totalEntradas">
            0
          </strong>

        </div>


        <div class="tarjeta-historial salidas">

          <span>
            Salidas
          </span>

          <strong id="totalSalidas">
            0
          </strong>

        </div>

      </div>


      <input
        id="busquedaHistorial"
        class="busqueda-historial"
        type="search"
        placeholder="Buscar por producto o SKU..."
      >


      <div class="filtros-historial">

        <button
          id="filtroTodos"
          class="filtro-historial activo"
          onclick="filtrarHistorial('todos')"
        >
          Todos
        </button>


        <button
          id="filtroEntradas"
          class="filtro-historial"
          onclick="filtrarHistorial('entrada')"
        >
          + Entradas
        </button>


        <button
          id="filtroSalidas"
          class="filtro-historial"
          onclick="filtrarHistorial('salida')"
        >
          − Salidas
        </button>

      </div>


      <button
        class="boton-borrar-historial"
        onclick="borrarHistorial()"
      >
        🗑️ Borrar historial
      </button>


      <div id="listaHistorial"></div>

    </div>

  </div>


  <!-- =========================
       MODAL PRODUCTO
  ========================= -->

  <div
    class="modal"
    id="modalProducto"
  >

    <form
      class="formulario"
      id="formularioProducto"
    >

      <h2 id="tituloFormulario">
        Agregar producto
      </h2>


      <div class="campo">

        <label for="nombre">
          Nombre del producto
        </label>

        <input
          id="nombre"
          type="text"
          placeholder="Ej. Camisa azul"
          required
        >

      </div>


      <div class="campo">

        <label for="sku">
          SKU
        </label>

        <input
          id="sku"
          type="text"
          placeholder="Ej. FLK-001"
          required
        >

      </div>


      <div class="campo">

        <label for="cantidadProducto">
          Cantidad
        </label>

        <input
          id="cantidadProducto"
          type="number"
          min="0"
          placeholder="Ej. 10"
          required
        >

      </div>


      <div class="campo">

        <label for="precio">
          Precio
        </label>

        <input
          id="precio"
          type="number"
          min="0"
          step="0.01"
          placeholder="Ej. 25.00"
          required
        >

      </div>


      <div class="botones-formulario">

        <button
          type="button"
          class="boton-cancelar"
          onclick="cerrarFormulario()"
        >
          Cancelar
        </button>


        <button
          type="submit"
          class="boton-guardar"
        >
          Guardar
        </button>

      </div>

    </form>

  </div>


  <!-- =========================
       MODAL MOVIMIENTO
  ========================= -->

  <div
    class="modal"
    id="modalMovimiento"
  >

    <form
      class="formulario"
      id="formularioMovimiento"
    >

      <h2 id="tituloMovimiento">
        Movimiento
      </h2>


      <p
        class="mensaje-movimiento"
        id="textoMovimiento"
      >
        Movimiento de inventario
      </p>


      <div class="campo">

        <label for="cantidadMovimiento">
          Cantidad
        </label>

        <input
          id="cantidadMovimiento"
          type="number"
          min="1"
          step="1"
          placeholder="Ej. 5"
          required
        >

      </div>


      <div class="botones-formulario">

        <button
          type="button"
          class="boton-cancelar"
          onclick="cerrarMovimiento()"
        >
          Cancelar
        </button>


        <button
          type="submit"
          class="boton-guardar"
        >
          Confirmar
        </button>

      </div>

    </form>

  </div>


  <!-- =========================
       MENU INFERIOR
  ========================= -->

  <div class="menu">

    <button
      id="botonInventario"
      class="activo"
      onclick="mostrarInventario()"
    >
      Inventario
    </button>


    <button
      onclick="abrirFormulario()"
    >
      Agregar
    </button>


    <button
      id="botonHistorial"
      onclick="mostrarHistorial()"
    >
      Historial
    </button>

  </div>


  <script>

    /* =========================
       DATOS
    ========================= */

    let productos =
      JSON.parse(
        localStorage.getItem(
          "flackunloker_productos"
        )
      ) || [];


    let historial =
      JSON.parse(
        localStorage.getItem(
          "flackunloker_historial"
        )
      ) || [];


    let productoEditando = null;

    let productoMovimiento = null;

    let tipoMovimiento = null;

    let filtroHistorialActual = "todos";


    /* =========================
       GUARDAR DATOS
    ========================= */

    function guardarDatos() {

      localStorage.setItem(
        "flackunloker_productos",
        JSON.stringify(productos)
      );

    }


    function guardarHistorial() {

      localStorage.setItem(
        "flackunloker_historial",
        JSON.stringify(historial)
      );

    }


    /* =========================
       FORMULARIO PRODUCTO
    ========================= */

    function abrirFormulario() {

      mostrarInventario();

      productoEditando = null;


      document
        .getElementById(
          "tituloFormulario"
        )
        .textContent =
        "Agregar producto";


      document
        .getElementById(
          "formularioProducto"
        )
        .reset();


      document
        .getElementById(
          "modalProducto"
        )
        .classList.add(
          "visible"
        );


      document
        .getElementById(
          "nombre"
        )
        .focus();

    }


    function editarProducto(id) {

      const producto =
        productos.find(
          function(item) {

            return item.id === id;

          }
        );


      if (!producto) {

        return;

      }


      productoEditando = id;


      document
        .getElementById(
          "tituloFormulario"
        )
        .textContent =
        "Editar producto";


      document
        .getElementById(
          "nombre"
        )
        .value =
        producto.nombre;


      document
        .getElementById(
          "sku"
        )
        .value =
        producto.sku;


      document
        .getElementById(
          "cantidadProducto"
        )
        .value =
        producto.cantidad;


      document
        .getElementById(
          "precio"
        )
        .value =
        producto.precio;


      document
        .getElementById(
          "modalProducto"
        )
        .classList.add(
          "visible"
        );

    }


    function cerrarFormulario() {

      document
        .getElementById(
          "modalProducto"
        )
        .classList.remove(
          "visible"
        );


      document
        .getElementById(
          "formularioProducto"
        )
        .reset();


      productoEditando = null;

    }


    document
      .getElementById(
        "formularioProducto"
      )
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();


          const nombre =
            document
              .getElementById(
                "nombre"
              )
              .value
              .trim();


          const sku =
            document
              .getElementById(
                "sku"
              )
              .value
              .trim();


          const cantidad =
            Number(
              document
                .getElementById(
                  "cantidadProducto"
                )
                .value
            );


          const precio =
            Number(
              document
                .getElementById(
                  "precio"
                )
                .value
            );


          if (!nombre || !sku) {

            alert(
              "Completa el nombre y el SKU."
            );

            return;

          }


          if (
            cantidad < 0 ||
            precio < 0
          ) {

            alert(
              "La cantidad y el precio no pueden ser negativos."
            );

            return;

          }


          if (
            productoEditando !== null
          ) {

            const producto =
              productos.find(
                function(item) {

                  return (
                    item.id ===
                    productoEditando
                  );

                }
              );


            if (producto) {

              producto.nombre =
                nombre;

              producto.sku =
                sku;

              producto.cantidad =
                cantidad;

              producto.precio =
                precio;

            }

          } else {

            const producto = {

              id: Date.now(),

              nombre: nombre,

              sku: sku,

              cantidad: cantidad,

              precio: precio

            };


            productos.push(
              producto
            );

          }


          guardarDatos();

          mostrarProductos();

          cerrarFormulario();

        }
      );


    /* =========================
       ENTRADA / SALIDA
    ========================= */

    function abrirMovimiento(
      id,
      tipo
    ) {

      const producto =
        productos.find(
          function(item) {

            return item.id === id;

          }
        );


      if (!producto) {

        return;

      }


      productoMovimiento =
        id;

      tipoMovimiento =
        tipo;


      if (
        tipo === "entrada"
      ) {

        document
          .getElementById(
            "tituloMovimiento"
          )
          .textContent =
          "Entrada de mercancía";


        document
          .getElementById(
            "textoMovimiento"
          )
          .textContent =
          "Agregar unidades a: " +
          producto.nombre;

      } else {

        document
          .getElementById(
            "tituloMovimiento"
          )
          .textContent =
          "Salida de mercancía";


        document
          .getElementById(
            "textoMovimiento"
          )
          .textContent =
          "Retirar unidades de: " +
          producto.nombre;

      }


      document
        .getElementById(
          "cantidadMovimiento"
        )
        .value = "";


      document
        .getElementById(
          "modalMovimiento"
        )
        .classList.add(
          "visible"
        );


      document
        .getElementById(
          "cantidadMovimiento"
        )
        .focus();

    }


    function cerrarMovimiento() {

      document
        .getElementById(
          "modalMovimiento"
        )
        .classList.remove(
          "visible"
        );


      document
        .getElementById(
          "formularioMovimiento"
        )
        .reset();


      productoMovimiento = null;

      tipoMovimiento = null;

    }


    document
      .getElementById(
        "formularioMovimiento"
      )
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();


          const cantidad =
            Number(
              document
                .getElementById(
                  "cantidadMovimiento"
                )
                .value
            );


          if (
            !Number.isInteger(
              cantidad
            ) ||
            cantidad <= 0
          ) {

            alert(
              "Introduce una cantidad válida."
            );

            return;

          }


          const producto =
            productos.find(
              function(item) {

                return (
                  item.id ===
                  productoMovimiento
                );

              }
            );


          if (!producto) {

            cerrarMovimiento();

            return;

          }


          /*
             Calculamos primero el nuevo saldo.
          */

          let nuevoSaldo =
            Number(
              producto.cantidad
            );


          if (
            tipoMovimiento ===
            "entrada"
          ) {

            nuevoSaldo +=
              cantidad;

          }


          if (
            tipoMovimiento ===
            "salida"
          ) {

            if (
              cantidad >
              producto.cantidad
            ) {

              alert(
                "No puedes retirar más unidades de las que existen en inventario."
              );

              return;

            }


            nuevoSaldo -=
              cantidad;

          }


          /*
             Actualizamos inventario.
          */

          producto.cantidad =
            nuevoSaldo;


          /*
             Registramos movimiento
             con el saldo resultante.
          */

          const movimiento = {

            id: Date.now(),

            productoId:
              producto.id,

            nombre:
              producto.nombre,

            sku:
              producto.sku,

            tipo:
              tipoMovimiento,

            cantidad:
              cantidad,

            saldo:
              nuevoSaldo,

            fecha:
              new Date().toISOString()

          };


          historial.unshift(
            movimiento
          );


          guardarDatos();

          guardarHistorial();

          mostrarProductos();

          cerrarMovimiento();

        }
      );


    /* =========================
       ELIMINAR PRODUCTO
    ========================= */

    function eliminarProducto(
      id
    ) {

      const confirmar =
        confirm(
          "¿Quieres eliminar este producto?"
        );


      if (!confirmar) {

        return;

      }


      productos =
        productos.filter(
          function(producto) {

            return producto.id !== id;

          }
        );


      guardarDatos();

      mostrarProductos();

    }


    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */

    function mostrarProductos() {

      const lista =
        document.getElementById(
          "listaProductos"
        );


      const textoBusqueda =
        document
          .getElementById(
            "busqueda"
          )
          .value
          .toLowerCase()
          .trim();


      const productosFiltrados =
        productos.filter(
          function(producto) {

            return (
              producto.nombre
                .toLowerCase()
                .includes(
                  textoBusqueda
                )
              ||
              producto.sku
                .toLowerCase()
                .includes(
                  textoBusqueda
                )
            );

          }
        );


      lista.innerHTML = "";


      if (
        productosFiltrados.length === 0
      ) {

        lista.innerHTML = `

          <div class="sin-productos">

            ${
              productos.length === 0
                ? "No hay productos todavía.<br>Presiona + Agregar para comenzar."
                : "No encontramos productos con esa búsqueda."
            }

          </div>

        `;

      } else {

        productosFiltrados.forEach(
          function(producto) {

            const elemento =
              document.createElement(
                "div"
              );


            elemento.className =
              "producto";


            elemento.innerHTML = `

              <div class="producto-superior">

                <div class="producto-info">

                  <h3>
                    ${producto.nombre}
                  </h3>

                  <p>
                    SKU: ${producto.sku}
                  </p>

                </div>


                <div class="cantidad">
                  ${producto.cantidad}
                </div>

              </div>


              <div class="producto-precio">

                Precio:

                <strong>
                  $${Number(
                    producto.precio
                  ).toFixed(2)}
                </strong>

                &nbsp;·&nbsp;

                Valor:

                <strong>
                  $${(
                    producto.cantidad *
                    producto.precio
                  ).toFixed(2)}
                </strong>

              </div>


              <div class="acciones">

                <button
                  class="accion entrada"
                  onclick="abrirMovimiento(${producto.id}, 'entrada')"
                >
                  + Entrada
                </button>


                <button
                  class="accion salida"
                  onclick="abrirMovimiento(${producto.id}, 'salida')"
                >
                  − Salida
                </button>


                <button
                  class="accion editar"
                  onclick="editarProducto(${producto.id})"
                >
                  ✏️ Editar
                </button>


                <button
                  class="accion eliminar"
                  onclick="eliminarProducto(${producto.id})"
                >
                  🗑️ Eliminar
                </button>

              </div>

            `;


            lista.appendChild(
              elemento
            );

          }
        );

      }


      actualizarResumen();

    }


    /* =========================
       RESUMEN INVENTARIO
    ========================= */

    function actualizarResumen() {

      const totalProductos =
        productos.length;


      const totalUnidades =
        productos.reduce(
          function(
            total,
            producto
          ) {

            return (
              total +
              Number(
                producto.cantidad
              )
            );

          },
          0
        );


      const valorInventario =
        productos.reduce(
          function(
            total,
            producto
          ) {

            return (
              total +
              (
                Number(
                  producto.cantidad
                ) *
                Number(
                  producto.precio
                )
              )
            );

          },
          0
        );


      document
        .getElementById(
          "totalProductos"
        )
        .textContent =
        totalProductos;


      document
        .getElementById(
          "totalUnidades"
        )
        .textContent =
        totalUnidades;


      document
        .getElementById(
          "valorInventario"
        )
        .textContent =
        "$" +
        valorInventario.toFixed(
          2
        );

    }


    /* =========================
       BUSCADOR INVENTARIO
    ========================= */

    document
      .getElementById(
        "busqueda"
      )
      .addEventListener(
        "input",
        function() {

          mostrarProductos();

        }
      );


    /* =========================
       HISTORIAL
    ========================= */

    function mostrarHistorial() {

      document
        .getElementById(
          "vistaInventario"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "vistaHistorial"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "botonInventario"
        )
        .classList.remove(
          "activo"
        );


      document
        .getElementById(
          "botonHistorial"
        )
        .classList.add(
          "activo"
        );


      actualizarResumenHistorial();

      mostrarListaHistorial();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       RESUMEN HISTORIAL
    ========================= */

    function actualizarResumenHistorial() {

      const total =
        historial.length;


      const entradas =
        historial.reduce(
          function(
            total,
            movimiento
          ) {

            if (
              movimiento.tipo ===
              "entrada"
            ) {

              return (
                total +
                Number(
                  movimiento.cantidad
                )
              );

            }

            return total;

          },
          0
        );


      const salidas =
        historial.reduce(
          function(
            total,
            movimiento
          ) {

            if (
              movimiento.tipo ===
              "salida"
            ) {

              return (
                total +
                Number(
                  movimiento.cantidad
                )
              );

            }

            return total;

          },
          0
        );


      document
        .getElementById(
          "totalMovimientos"
        )
        .textContent =
        total;


      document
        .getElementById(
          "totalEntradas"
        )
        .textContent =
        entradas;


      document
        .getElementById(
          "totalSalidas"
        )
        .textContent =
        salidas;

    }


    /* =========================
       MOSTRAR LISTA HISTORIAL
    ========================= */

    function mostrarListaHistorial() {

      const lista =
        document.getElementById(
          "listaHistorial"
        );


      const textoBusqueda =
        document
          .getElementById(
            "busquedaHistorial"
          )
          .value
          .toLowerCase()
          .trim();


      const movimientosFiltrados =
        historial.filter(
          function(movimiento) {

            const nombre =
              String(
                movimiento.nombre ||
                ""
              ).toLowerCase();


            const sku =
              String(
                movimiento.sku ||
                ""
              ).toLowerCase();


            const coincideTexto =
              nombre.includes(
                textoBusqueda
              ) ||
              sku.includes(
                textoBusqueda
              );


            const coincideTipo =
              filtroHistorialActual ===
                "todos"
              ||
              movimiento.tipo ===
                filtroHistorialActual;


            return (
              coincideTexto &&
              coincideTipo
            );

          }
        );


      lista.innerHTML = "";


      if (
        movimientosFiltrados.length ===
        0
      ) {

        lista.innerHTML = `

          <div class="sin-productos">

            ${
              historial.length === 0
                ? "No hay movimientos registrados todavía."
                : "No encontramos movimientos con esos filtros."
            }

          </div>

        `;

        return;

      }


      movimientosFiltrados.forEach(
        function(movimiento) {

          const elemento =
            document.createElement(
              "div"
            );


          elemento.className =
            "movimiento";


          const fecha =
            new Date(
              movimiento.fecha
            );


          const fechaTexto =
            fecha.toLocaleDateString(
              "es-PR",
              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
              }
            );


          const horaTexto =
            fecha.toLocaleTimeString(
              "es-PR",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          const esEntrada =
            movimiento.tipo ===
            "entrada";


          let saldoTexto;


          if (
            movimiento.saldo !==
            undefined &&
            movimiento.saldo !==
            null
          ) {

            saldoTexto = `
              Saldo después del movimiento:
              <strong>
                ${movimiento.saldo}
              </strong>
            `;

          } else {

            saldoTexto = `
              Saldo después del movimiento:
              <strong>
                No disponible
              </strong>
            `;

          }


          elemento.innerHTML = `

            <div class="movimiento-superior">

              <div class="movimiento-info">

                <h3>
                  ${movimiento.nombre}
                </h3>

                <p>
                  SKU: ${movimiento.sku}
                </p>

              </div>


              <div
                class="movimiento-tipo ${
                  esEntrada
                    ? "entrada"
                    : "salida"
                }"
              >

                ${
                  esEntrada
                    ? "＋ Entrada"
                    : "− Salida"
                }

              </div>

            </div>


            <div class="movimiento-detalle">

              Cantidad:

              <strong>
                ${movimiento.cantidad}
              </strong>

              &nbsp;·&nbsp;

              ${fechaTexto}

              ·

              ${horaTexto}


              <div class="saldo-movimiento">

                ${saldoTexto}

              </div>

            </div>

          `;


          lista.appendChild(
            elemento
          );

        }
      );

    }


    /* =========================
       FILTROS
    ========================= */

    function filtrarHistorial(
      tipo
    ) {

      filtroHistorialActual =
        tipo;


      document
        .getElementById(
          "filtroTodos"
        )
        .classList.remove(
          "activo"
        );


      document
        .getElementById(
          "filtroEntradas"
        )
        .classList.remove(
          "activo"
        );


      document
        .getElementById(
          "filtroSalidas"
        )
        .classList.remove(
          "activo"
        );


      if (
        tipo === "todos"
      ) {

        document
          .getElementById(
            "filtroTodos"
          )
          .classList.add(
            "activo"
          );

      }


      if (
        tipo === "entrada"
      ) {

        document
          .getElementById(
            "filtroEntradas"
          )
          .classList.add(
            "activo"
          );

      }


      if (
        tipo === "salida"
      ) {

        document
          .getElementById(
            "filtroSalidas"
          )
          .classList.add(
            "activo"
          );

      }


      mostrarListaHistorial();

    }


    /* =========================
       BUSCADOR HISTORIAL
    ========================= */

    document
      .getElementById(
        "busquedaHistorial"
      )
      .addEventListener(
        "input",
        function() {

          mostrarListaHistorial();

        }
      );


    /* =========================
       BORRAR HISTORIAL
    ========================= */

    function borrarHistorial() {

      if (
        historial.length === 0
      ) {

        alert(
          "No hay movimientos para borrar."
        );

        return;

      }


      const confirmar =
        confirm(
          "¿Quieres borrar todo el historial de movimientos?\n\nEsta acción no cambiará las cantidades del inventario."
        );


      if (!confirmar) {

        return;

      }


      historial = [];


      guardarHistorial();

      actualizarResumenHistorial();

      mostrarListaHistorial();

    }


    /* =========================
       MOSTRAR INVENTARIO
    ========================= */

    function mostrarInventario() {

      document
        .getElementById(
          "vistaInventario"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "vistaHistorial"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "botonInventario"
        )
        .classList.add(
          "activo"
        );


      document
        .getElementById(
          "botonHistorial"
        )
        .classList.remove(
          "activo"
        );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       CERRAR MODALES
    ========================= */

    document
      .getElementById(
        "modalProducto"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            cerrarFormulario();

          }

        }
      );


    document
      .getElementById(
        "modalMovimiento"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            cerrarMovimiento();

          }

        }
      );


    /* =========================
       INICIAR
    ========================= */

    mostrarProductos();

  </script>

</body>

</html>
