<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0a84ff">

  <title>Flackunloker</title>

  <style>

    *{box-sizing:border-box}

    body{

      margin:0;

      background:#f4f7fb;

      color:#111;

      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;

    }

    .contenedor{

      max-width:600px;

      margin:auto;

      padding:24px 18px;

    }

    .encabezado{

      text-align:center;

      margin:35px 0;

    }

    .logo{

      width:72px;

      height:72px;

      margin:auto;

      border-radius:20px;

      background:linear-gradient(135deg, #0a84ff, #0055cc);

    }

  </style>

</head>

<body>

  <div class="contenedor">

    <div class="encabezado">

      <div class="logo"></div>

    </div>

  </div>

</body>

</html>
